name: CI 🧪

on:
  push:
  pull_request:

  # Reused by the release workflow, so a release is tested the same way
  workflow_call:

jobs:
  test:
    name: Test & Build 🧪
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      # Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install PlatformIO
      - name: ⚙️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.2.0

      # Set up Node.js
      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      # Install the dependencies the web layer is tested with (exact versions, from the lockfile)
      - name: 📦 Install web dependencies
        run: npm ci

      # Run the tests of the gizmo-embed tool and of the shared web app layer
      - name: 🧪 Run gizmo-embed and web layer tests
        run: npm test

      # Run the native tests
      - name: 🧪 Run native tests
        run: pio test -e native

      # Compile the library and its examples for the ESP32
      - name: 🛠️ Build for ESP32
        run: pio run -e esp32dev -e esp32dev_wifi_setup
