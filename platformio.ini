; Development environments for the library itself (projects use it through lib_deps)
[platformio]
default_envs = native

; Host tests for the hardware-free modules (run with: pio test -e native)
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_flags =
	-std=gnu++17
lib_deps =
	throwtheswitch/Unity@2.6.1

; Compile check of the whole library for the ESP32, through the basic example (run with: pio run -e esp32dev)
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
build_src_filter = +<*> +<../examples/basic/>
build_src_flags = -Wformat
lib_deps =
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
	bblanchon/ArduinoJson@7.2.2

; Compile check of the Wi-Fi setup example (run with: pio run -e esp32dev_wifi_setup)
[env:esp32dev_wifi_setup]
extends = env:esp32dev
build_src_filter = +<*> +<../examples/wifi_setup/>
